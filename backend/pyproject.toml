[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-in-the-air"
version = "0.2.0"
description = "Drag-and-drop agentic workflow builder with a Python DAG runtime"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "openai>=1.30",
    "anthropic>=0.25",
    "google-generativeai>=0.7",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools]
packages = ["app", "app.nodes"]

# ─── Linting ─────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = ["E501", "B008"]  # B008: Body/Depends in defaults is standard FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF015", "RUF059"]
"**/transform.py" = ["E701"]

# ─── Testing ─────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "test_engine.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
